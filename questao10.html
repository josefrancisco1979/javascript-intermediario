<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Simulador de Caixa Eletrônico</title>
</head>
<body>
    <h2>Caixa Eletrônico</h2>
    
    <label>Digite o valor do saque (mínimo R$ 10):</label>
    <input type="number" id="valor" min="10">
    <button onclick="calcularNotas()">Sacar</button>

    <h3>Notas fornecidas:</h3>
    <p>R$ 100: <span id="nota100">0</span></p>
    <p>R$ 50: <span id="nota50">0</span></p>
    <p>R$ 20: <span id="nota20">0</span></p>
    <p>R$ 10: <span id="nota10">0</span></p>

    <script>
        function calcularNotas() {
            let valor = parseInt(document.getElementById("valor").value);

            if (isNaN(valor) || valor < 10) {
                alert("Valor inválido! Insira um valor inteiro de pelo menos R$ 10.");
                return;
            }

            let nota100 = 0, nota50 = 0, nota20 = 0, nota10 = 0;

            while (valor >= 100) { nota100++; valor -= 100; }
            while (valor >= 50) { nota50++; valor -= 50; }
            while (valor >= 20) { nota20++; valor -= 20; }
            while (valor >= 10) { nota10++; valor -= 10; }

            document.getElementById("nota100").innerText = nota100;
            document.getElementById("nota50").innerText = nota50;
            document.getElementById("nota20").innerText = nota20;
            document.getElementById("nota10").innerText = nota10;

            alert("Saque realizado com sucesso!");
        }
    </script>
</body>
</html>
